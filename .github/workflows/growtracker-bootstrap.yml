          import com.algorythmstudio.growtracker.ui.screens.MenuScreen
          import com.algorythmstudio.growtracker.ui.theme.GtColors

          data class TabSpec(val route: String, val label: String, val icon: Int)

          val Tabs = listOf(
              TabSpec("home", "Главная", R.drawable.ic_home),
              TabSpec("journal", "Журнал", R.drawable.ic_journal),
              TabSpec("calendar", "Календарь", R.drawable.ic_calendar),
              TabSpec("charts", "Графики", R.drawable.ic_chart),
              TabSpec("menu", "Меню", R.drawable.ic_menu)
          )

          @Composable
          fun GrowTrackerApp() {
              val nav = rememberNavController()
              val backStack by nav.currentBackStackEntryAsState()
              val currentRoute = backStack?.destination?.route
              val isTab = Tabs.any { it.route == currentRoute }

              GlowBackground {
                  Scaffold(
                      containerColor = Color.Transparent,
                      contentColor = GtColors.Text,
                      bottomBar = {
                          if (isTab) GtBottomBar(currentRoute) { route ->
                              nav.navigate(route) {
                                  popUpTo(nav.graph.findStartDestination().id) { saveState = true }
                                  launchSingleTop = true
                                  restoreState = true
                              }
                          }
                      },
                      floatingActionButton = {
                          if (currentRoute == "home" || currentRoute == "journal") {
                              PrimaryPillButton(text = "+ Событие", onClick = { nav.navigate("event_new") })
                          }
                      }
                  ) { padding ->
                      NavHost(navController = nav, startDestination = "home", modifier = Modifier.padding(padding)) {
                          composable("home") {
                              HomeScreen(onSeeAll = {
                                  nav.navigate("journal") { launchSingleTop = true }
                              })
                          }
                          composable("journal") { JournalScreen() }
                          composable("calendar") { CalendarScreen() }
                          composable("charts") { ChartsScreen() }
                          composable("menu") { MenuScreen() }
                          composable("event_new") { EventNewScreen(onBack = { nav.popBackStack() }) }
                      }
                  }
              }
          }

          @Composable
          private fun GtBottomBar(currentRoute: String?, onTab: (String) -> Unit) {
              Column(Modifier.fillMaxWidth().background(GtColors.Surface)) {
                  Spacer(Modifier.fillMaxWidth().height(1.dp).background(GtColors.Stroke))
                  Row(Modifier.fillMaxWidth().navigationBarsPadding().height(64.dp)) {
                      Tabs.forEach { tab ->
                          val selected = tab.route == currentRoute
                          Column(
                              modifier = Modifier
                                  .weight(1f)
                                  .fillMaxHeight()
                                  .clickable { onTab(tab.route) }
                                  .padding(top = 9.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Icon(
                                  painterResource(tab.icon),
                                  contentDescription = tab.label,
                                  tint = if (selected) GtColors.Lime else GtColors.Text2,
                                  modifier = Modifier.size(24.dp)
                              )
                              Spacer(Modifier.height(4.dp))
                              Text(
                                  tab.label,
                                  style = MaterialTheme.typography.labelSmall,
                                  color = if (selected) GtColors.Lime else GtColors.Text2,
                                  maxLines = 1
                              )
                          }
                      }
                  }
              }
          }
