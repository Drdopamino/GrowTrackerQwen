name: GrowTracker Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fonts
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/montserrat_variable.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf'
          curl -fsSL -o app/src/main/res/font/spacegrotesk_variable.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf'

      - name: Project
        run: |
          set -e
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); maven("https://maven-central.storage-download.googleapis.com/maven2/"); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); maven("https://maven-central.storage-download.googleapis.com/maven2/"); mavenCentral() }
          }
          rootProject.name = "GrowTracker"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.algorythmstudio.growtracker"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.algorythmstudio.growtracker"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.GrowTracker">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">GrowTracker</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#141414</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.GrowTracker" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/font/montserrat.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <font-family xmlns:android="http://schemas.android.com/apk/res/android">
              <font android:font="@font/montserrat_variable" android:fontStyle="normal" android:fontWeight="400" android:fontVariationSettings="'wght' 400" />
              <font android:font="@font/montserrat_variable" android:fontStyle="normal" android:fontWeight="500" android:fontVariationSettings="'wght' 500" />
              <font android:font="@font/montserrat_variable" android:fontStyle="normal" android:fontWeight="600" android:fontVariationSettings="'wght' 600" />
          </font-family>
          EOF

          cat > app/src/main/res/font/cy_grotesk_grand.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <font-family xmlns:android="http://schemas.android.com/apk/res/android">
              <font android:font="@font/spacegrotesk_variable" android:fontStyle="normal" android:fontWeight="700" android:fontVariationSettings="'wght' 700" />
          </font-family>
          EOF

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <group android:translateX="22.8" android:translateY="22.8" android:scaleX="2.6" android:scaleY="2.6">
                  <path android:pathData="M12,3.6 C12,3.6 6.2,10.1 6.2,14.4 A5.8,5.8 0 0 0 17.8,14.4 C17.8,10.1 12,3.6 12,3.6 Z"
                      android:strokeColor="#B4F000" android:strokeWidth="2.0" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
              </group>
          </vector>
          EOF

          icon() {
          cat > "app/src/main/res/drawable/$1.xml" <<EOF
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:pathData="$2" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.8" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
          </vector>
          EOF
          }
          icon ic_home 'M4.5,10.8 L12,4.2 L19.5,10.8 M6.3,9.2 V18.3 A1.5,1.5 0 0 0 7.8,19.8 H16.2 A1.5,1.5 0 0 0 17.7,18.3 V9.2 M10.2,19.8 V14.7 H13.8 V19.8'
          icon ic_journal 'M6.2,3.6 H17.4 A1.6,1.6 0 0 1 19,5.2 V18.8 A1.6,1.6 0 0 1 17.4,20.4 H6.2 A1.7,1.7 0 0 1 4.5,18.7 V5.3 A1.7,1.7 0 0 1 6.2,3.6 Z M8.6,8.2 H14.9 M8.6,12 H14.9 M8.6,15.8 H12.2'
          icon ic_calendar 'M6.3,4.8 H17.7 A1.8,1.8 0 0 1 19.5,6.6 V17.7 A1.8,1.8 0 0 1 17.7,19.5 H6.3 A1.8,1.8 0 0 1 4.5,17.7 V6.6 A1.8,1.8 0 0 1 6.3,4.8 Z M4.5,9.6 H19.5 M8.4,3 V6.4 M15.6,3 V6.4'
          icon ic_chart 'M4.5,4.5 V17.9 A1.6,1.6 0 0 0 6.1,19.5 H19.5 M7.8,15.2 L11.2,11.4 L13.6,13.4 L18.2,7.6'
          icon ic_menu 'M4.8,4.8 H9.6 V9.6 H4.8 Z M14.4,4.8 H19.2 V9.6 H14.4 Z M4.8,14.4 H9.6 V19.2 H4.8 Z M14.4,14.4 H19.2 V19.2 H14.4 Z'
          icon ic_drop 'M12,3.6 C12,3.6 6.2,10.1 6.2,14.4 A5.8,5.8 0 0 0 17.8,14.4 C17.8,10.1 12,3.6 12,3.6 Z'
          icon ic_spray 'M9.3,7.6 H12.9 L14.6,10.2 V18.4 A2,2 0 0 1 12.6,20.4 H9.6 A2,2 0 0 1 7.6,18.4 V10.2 Z M9.9,7.6 V4.8 H12.3 V7.6 M12.3,5.7 H14.4 M17,4.6 L17.01,4.6 M19.2,6.4 L19.21,6.4'
          icon ic_leaf 'M19.4,4.6 C10.6,4.6 4.8,10.4 4.6,19.4 C13.6,19.4 19.4,13.6 19.4,4.6 Z M4.6,19.4 C8.2,13.4 12.6,9.2 16.8,6.8'
          icon ic_flask 'M9.4,3.4 H14.6 M10.6,3.4 V9 L5.6,17.6 A1.9,1.9 0 0 0 7.3,20.4 H16.7 A1.9,1.9 0 0 0 18.4,17.6 L13.4,9 V3.4 M7.6,14.6 H16.4'
          icon ic_pencil 'M16.7,4.1 A2.45,2.45 0 0 1 20.2,7.6 L7.6,20.2 L3.4,21.2 L4.4,17 Z M14.6,6.2 L18.1,9.7'
          icon ic_gear 'M18.46,10.21 L18.63,11.01 L21.29,10.94 L21.29,13.06 L18.63,12.99 L18.46,13.79 L17.83,15.30 L17.39,15.99 L19.32,17.82 L17.82,19.32 L15.99,17.39 L15.30,17.83 L13.79,18.46 L12.99,18.63 L13.06,21.29 L10.94,21.29 L11.01,18.63 L10.21,18.46 L8.70,17.83 L8.01,17.39 L6.18,19.32 L4.68,17.82 L6.61,15.99 L6.17,15.30 L5.54,13.79 L5.37,12.99 L2.71,13.06 L2.71,10.94 L5.37,11.01 L5.54,10.21 L6.17,8.70 L6.61,8.01 L4.68,6.18 L6.18,4.68 L8.01,6.61 L8.70,6.17 L10.21,5.54 L11.01,5.37 L10.94,2.71 L13.06,2.71 L12.99,5.37 L13.79,5.54 L15.30,6.17 L15.99,6.61 L17.82,4.68 L19.32,6.18 L17.39,8.01 L17.83,8.70 Z M12,8.9 A3.1,3.1 0 1 0 12,15.1 A3.1,3.1 0 1 0 12,8.9'
          icon ic_note 'M13.6,3.6 H6.6 A1.8,1.8 0 0 0 4.8,5.4 V18.6 A1.8,1.8 0 0 0 6.6,20.4 H17.4 A1.8,1.8 0 0 0 19.2,18.6 V9.2 Z M13.6,3.6 V9.2 H19.2 M8.6,13 H15.4 M8.6,16.4 H13'
          icon ic_arrow_right 'M5.5,12 H18 M13.2,6.8 L18.4,12 L13.2,17.2'
          icon ic_arrow_left 'M18.5,12 H6 M10.8,6.8 L5.6,12 L10.8,17.2'
          icon ic_trash 'M4.6,6.6 H19.4 M9.2,6.6 V5.2 A1.6,1.6 0 0 1 10.8,3.6 H13.2 A1.6,1.6 0 0 1 14.8,5.2 V6.6 M6.6,6.6 L7.4,18.5 A1.9,1.9 0 0 0 9.3,20.3 H14.7 A1.9,1.9 0 0 0 16.6,18.5 L17.4,6.6 M10.1,10.4 V16.4 M13.9,10.4 V16.4'

          mkdir -p app/src/main/java/com/algorythmstudio/growtracker
          cp src/*.kt app/src/main/java/com/algorythmstudio/growtracker/
          ls app/src/main/java/com/algorythmstudio/growtracker/

      - name: APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show error
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Caused by|Execution failed|Could not" build.log | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: GrowTracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

# END OF FILE
